<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastrar</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
 
<body id='fundo'>
    <div>
        <img class="logo" src="./img/imagem (2).png" alt="">
        <p>Digite seu nome:</p>
        <input type="text" id="usuario">
 
        <p>Digite uma senha:</p>
        <input type="password" id="senha">
 
        <p>Digite seu telefone:</p>
        <input type="text" id="celular">
 
        <p>Digite seu e-mail:</p>
        <input type="text" id="email">
 
        <p>Digite sua idade:</p>
        <input type="text" id="idade">
 
      <button class="botao" onclick="cadastrar()">Cadastrar</button>
        <a class="opcao" href="../index.html">Voltar</a>
 
    </div>
 
 
 
 
    <script>
        let fundo = window.document.getElementById("fundo")
        fundo.style.color = "black"
 
       
           function cadastrar() {
 
    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;
    let celular = document.getElementById("celular").value;
    let email = document.getElementById("email").value;
    let idade = document.getElementById("idade").value;
 
    if (usuario == "" || senha == "" || celular == "" || email == "" || idade == "") {
 
        alert("Preencha todos os campos!");
 
    } else {
 
        alert("Cadastro realizado com sucesso!\nNome: " + usuario);
 
    }
}
 
 
 
    </script>
 
</body>
 
</html>
