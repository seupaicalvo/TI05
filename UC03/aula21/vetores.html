<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array</title>
    <script>
        // Array indexado
        var frutas = Array();
        furtas = ["banana", "maça", "abacaxi"]
        console.log(frutas);
        console.log(frutas[1]);

        var coisas = ["Christian", 17, 1.86, true];
        console.log(coisas);
        
        //Array nominal 
        var cadastro = Array()
        cadastro["nome"] = "Christian";
        cadastro["idade"] = "17";
        cadastro["altura"] = "1.86";
        

        console.log(cadastro);


        // matriz

        var agenda = Array()

        agenda["nomes"] = Array("Christian", "Marcelo", "Marcos");
        agenda["telefones"] = ["111111", "2222222", "3333333"]


        for(i = 0; i <= agenda.length; i++){
        console.log((agenda["nomes"][i]) + " - " + (agenda["telefones"][i]))
        }
        



    </script>
</head>

</body>

</html>
