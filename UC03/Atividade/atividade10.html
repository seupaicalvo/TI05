<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade10</title>
    <script>
       /* Uma loja oferece descontos conforme o valor da compra:

Até R$ 100 → Sem desconto
Até R$ 500 → 10% de desconto
Acima de R$ 500 → 20% de desconto
Mostre apenas qual desconto o cliente receberá.*/

  var valor;
  var desconto;

  valor = prompt("valor da compra");

  if(valor < 100){
    desconto = "Sem desconto";
  }
  else if(valor <= 500){
    desconto = "10% de desconto";
  }
  else if(valor > 500){
    desconto = "20% de desconto";
  }

  console.log("o seu desconto é de : " + desconto);

    </script>
</head>

</body>
</html>
