<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade6</title>
    <script>
        /*Classifique um produto de acordo com seu preço:

Até R$ 50 → Econômico
Até R$ 200 → Intermediário
Acima de R$ 200 → Premium*/


 var preco
 var produto

   preco = prompt("qual é o preço do produto?")

   if(preco < 50){
     produto = "Econômico"
   }
   else if(preco < 200){
     produto = "Intermediário"
   }
   else if(preco > 200){
     produto = "Premium"
   }

   console.log("O preço de acordo com o produto é de " + produto)
    </script>
