<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade7</title>
    <script>
       /* A meta diária de um vendedor é R$ 3.000.

Menor que R$ 3.000 → Meta não atingida
Igual a R$ 3.000 → Meta atingida
Maior que R$ 3.000 → Meta superada*/

  var meta;
  var vedendor;

   meta = prompt("qual foi a meta diaria do vendendor?");

   if(meta < 2999){
     vedendor = "meta não atingida";
   }
   else if(meta <= 3000){
     vendendor = "meta atiginda";
   }
   else if(meta > 3000){
     vedendor = "meta superada";
   }

   console.log("O vedendor teve sua meta " + vedendor); 



    </script>
</head>
