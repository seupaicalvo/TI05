<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade3</title>
    <script>
        /*Classifique um cliente conforme o valor gasto:

Menor que R$ 100 → Cliente Bronze
Entre R$ 100 e R$ 499 → Cliente Prata
R$ 500 ou mais → Cliente Ouro*/


      
      var valor;

      valor = prompt("digite o valor gasto na compra");

      if(valor < 100){
        valor = "Bronze";
      }
      else if(valor < 499){
        valor = "Prata";
      }
      else if(valor  > 500){
        valor = "Ouro";
      }

      console.log("Parabéns com valor da sua compra, você virou cliente " + valor);



    </script>
</head>
