<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade4</title>
    <script>
        /*Determine a comissão de um vendedor:

Até R$ 1.000 em vendas → Comissão de R$ 50
Até R$ 5.000 → Comissão de R$ 200
Acima de R$ 5.000 → Comissão de R$ 500*/

  var valor;
  var comissao

  valor = prompt("digite as vendas que seu vedendor fez");

   if(valor < 1000){
     comissao = "R$ 50";
   }
   else if(valor < 5000){
     comissao = "R$ 200";
   }
   else if(valor > 5000){
     comissao = "R$ 500";
   }

   console.log("o valor da comissão do vedendor é de " + comissao);


    </script>
