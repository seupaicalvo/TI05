<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade9</title>
    <script>
/*Classifique o desempenho do vendedor:

Menos de 20 vendas → Regular
De 20 a 49 vendas → Bom
50 vendas ou mais → Excelente*/
    
    var vedendor
    var desempenho
    
    vedendor = prompt("qual foi o desempenho de vendas do vedendor?")

    if(vedendor < 20){
        desempenho = "Regular"
    }
    else if(vedendor <= 49){
        desempenho = "Bom"
    }
    else if(vedendor > 50){
        desempenho = "Excelente"
    }

    console.log("O desempenho do vedendor foi de : " + desempenho)


    </script>
