    <script>
        /*Verifique a situação de um produto:

Estoque igual a 0 → Esgotado
Estoque até 10 unidades → Estoque Baixo
Acima de 10 unidades → Estoque Normal*/


  var unidade; 
  var estoque;
    
   estoque = prompt("digite o valor quantas unidades o estoque tem?");

   if(estoque == 0){
     unidade = "esgotado";
   }
   else if(estoque < 10){
      unidade = "estoque baixo";
   }
   else if(estoque > 10){
      unidade = "estoque normal";
   }

   console.log("Com a quantia de unidades no seu estoque, seu estoque está " + unidade);


    </script>
