<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 01</title>
    <script>
       // Uma loja realiza entregas apenas para compras acima de R$ 50,00. Peça ao usuário o valor da compra e informe se ele tem direito à entrega.

        
        
        var valor;
        var entrega;

        valor = prompt("digite o valor da compra");

        if(valor >= 50){
            entrega = "frete gratis";
        }else{ 
            entrega = "frete de 10R$";
        }
        
        console.log("O frete da sua entrega foi para: " + entrega);

         
    </script>
</head>
