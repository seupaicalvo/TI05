<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laços de repetição - FOR</title>
    <script>

        /*

          var - sobe um escopo 
          let - variavel local

          incremento - i = i + 1 ou i +=1 ou i++
          decremento - i = i -1 ou i -= 1 ou i --
        
          for(variavel, condição, controle)
        
        */

        var cont = prompt("Digite um numero");

        for (let i = 10; i >= 5; i = i ++ ) {   
            console.log(i + " - Olá");
        }

        console.log(i)

    </script>
</head>
