        let num = prompt("digite um numero");
        var i = 1;
        var l = 1;
        while (i <= 10){
            console.log(i + " X " + num + " = " + i * num);
            i++
        }

        console.log("usando o while")

        do{
            console.log(l + " X " + num + " = " + l * num);
            l++
        } while (l <= 10);
