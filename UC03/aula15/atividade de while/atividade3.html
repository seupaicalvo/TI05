<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let opcao;

        do {
            opcao = Number(prompt("1- Tabuada\n2- Contagem\n0- Sair"));

            if (opcao == 1) {
                for (let i = 1; i <= 10; i++) {
                    alert("5 x " + i + " = " + (5 * i));
                }
            }

            if (opcao == 2) {
                for (let i = 10; i >= 0; i--) {
                    alert(i);
                }
            }

        } while (opcao != 0);








    </script>
</head>

</body>

</html>
