<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let soma = 0;
        let nota;

        for (let i = 1; i <= 4; i++) {
            do {
                nota = Number(prompt("Digite a nota do " + i + " bimestre (0 a 10):"));
            } while (nota < 0 || nota > 10);

            soma += nota;
        }

        let media = soma / 4;

        alert("A média do aluno é: " + media);







    </script>
</head>

</html>
