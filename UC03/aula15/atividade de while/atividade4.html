<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let saldo = 500;
        let saque;

        while (saldo >= 0) {
            saque = Number(prompt("Saldo: R$" + saldo + "\nDigite o valor do saque (0 para sair):"));

            if (saque == 0) {
                break;
            }

            if (saque > saldo) {
                alert("Saldo insuficiente");
            } else {
                saldo = saldo - saque;
                alert("Novo saldo: R$" + saldo);
            }
        }







    </script>
</head>

<body>

</body>

</html>
