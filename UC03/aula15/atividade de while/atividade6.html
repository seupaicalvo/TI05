<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let jogando;
         let chute = 0;

        do {
            let sorteio = prompt("Jogador 1, digite o número secreto (1 a 10):");

            while (chute != sorteio) {
                chute = prompt("Jogador 2, adivinhe o número:");
            }

            jogando = confirm("Você acertou! Quer jogar de novo?");
        } while (jogando);






    </script>
</head>
