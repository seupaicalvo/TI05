<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let senha = "";
        let tentativas = 0;

        while (senha != "1234" && tentativas < 3) {
            senha = prompt("Digite a senha:");
            tentativas++;
        }

        if (senha == "1234") {
            for (let i = 1; i <= 5; i++) {
                alert("Bem-vindo ao sistema!");
            }
        } else {
            alert("Senha incorreta!");
        }








    </script>
</head>

</html>
