<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let maiores = 0;
        let idade = prompt("Digite a idade do aluno " + i + ":");

        for (let i = 1; i <= 5; i++) {


            while (idade < 0 || idade > 120) {
                idade = prompt("Idade inválida. Digite novamente a idade (entre 0 e 120):");
            }

            if (idade >= 18) {
                maiores = maiores + 1;
            }
        }

        alert("Alunos maiores de idade: " + maiores);






    </script>
</head>
