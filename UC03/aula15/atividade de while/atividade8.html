<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let numero;

        do {
            numero = prompt("Qual tabuada você quer ver? (Digite 0 para sair)");

            if (numero != 0) {
                for (let i = 1; i <= 10; i++) {
                    console.log(numero + " x " + i + " = " + (numero * i));
                }
            }
        } while (numero != 0);






    </script>
</head>
