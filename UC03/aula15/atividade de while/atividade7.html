<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade</title>
    <script>
        let numero = prompt("Digite um número:");
        let fatorial = 1;

        while (numero < 0) {
            numero = prompt("Digite um número maior ou igual a 0:");
        }

        for (let i = 1; i <= numero; i++) {
            fatorial = fatorial * i;
        }

        alert(fatorial);






    </script>
</head>
