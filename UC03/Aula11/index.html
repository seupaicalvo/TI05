<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch case</title>
    <script>
    var opcao
    opcao = prompt("digite um caso:")
    switch(opcao){
        case '1':
            alert("você digitou 1")
            break
        case '2':
            alert("você digitou 2")
            break
        case '3':
            alert("você digitou 3")
            break
        case 'Sim':
            alert("você digitou Sim")
            break
        case 'Não':
            alert("você digitou Não")    
            
            default:
                alert("você digitou outra opcão")
            
    }




    </script>
</head>
<body>
    
</body>
</html>
