<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <link rel="stylesheet" href="dom2.css">
</head>

<body>



    <main>
        <div>
            <input type="number" id="hora" placeholder="digite a hora (0-23)">
            <button onclick="verHorario()">Ver Horario</button>
            <h2 id="resultado"></h2>
            <img id="imagem" width="300">
            <script>
                function verHorario() {
                    let hora = Number(document.getElementById("hora").value);
                    let resultado = document.getElementById("resultado");
                    let imagem = document.getElementById("imagem");
                    if (hora >= 5 && hora < 12) {
                        resultado.innerHTML = "bom dia!";

                    }
                    else if (hora >= 12 && hora < 18) {
                        resultado.innerHTML = "boa tarde!";
                    }
                    else if (hora >= 18 && hora < 24) {
                        resultado.innerHTML = "boa noite!";
                    }
                    else if (hora >= 0 && hora < 5) {
                        resultado.innerHTML = "boa madrugada!"
                    }
                    else {
                        resultado.innerHTML = "digite uma hora valida! "
                    }
                }
            </script>

        </div>
    </main>


</body>

</html>
