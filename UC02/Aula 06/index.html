<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 06</title>

     <!--
       formulario:
           inputs
              text  
              email
              numero
            select
              checkbox





     -->



</head>
<body>
    
    <form action="home.html" method="get">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome">
        
        <br><br>

        <label for="email">e-mail</label>
        <input type="email" name="email" id="email" required>

        <br><br>


        <label for="idade">Idade</label>
        <input type="number" name="idade" id="idade" max="99" min="1">

        <br><br>

        <label for="telefone">telefone</label>
        <input type="tel" name="telefone" id="telefone">

        <br><br>
        <label for="estado">Estado</label>
        <select  name="estado" id="estado">
            <option value="">Selecione</option>

            <optgroup label="Sul">            
            <option value="SP">São Paulo</option>
            <option value="SC">Santa Catarina</option>
            <option value="Rj">Rio de Janeiro</option>
            </optgroup>


            <optgroup label="Nordeste"></optgroup>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande Do Sul</option>
            <option value="PR">Paraná</option>
            </optgroup>
        
        
        </select>

        <br><br>

        <textarea name="message" rows="10" cols="30" placeholder="digite aqui seu texto"></textarea>

        <br><br>

        <Label>Qual a sua linguagem de programaçao favorita</Label> 
        <br>
        
        <input type="radio" name="favorita1" id="favorita-1" value="javascript">
        <label for="javascript">javascript</label>

        <input type="radio" name="favorita2" id="favorita-2" value="python">
        <label for="python">python</label>

        <input type="radio" name="favorita3" id="favorita-3" value="C#">
        <label for="C#">C#</label>
        
        <br><br>
        
        <input type="checkbox" name="aceito" id="">
        <label for="aceito">aceito os termos de contrato</label>

        <br><br>

        <input type="submit" value="enviar">

        <input type="reset" value="limpar">


    </form>




</body>
</html>
